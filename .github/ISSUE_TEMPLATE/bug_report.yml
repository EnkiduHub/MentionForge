name: Bug report
description: Report unexpected behavior in MentionForge
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private keys, or Worker tokens. See [SECURITY.md](https://github.com/EnkiduHub/MentionForge/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, request surface (HTTP or MCP), and a minimal example.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version if relevant (repo `.nvmrc` is 22).
      placeholder: "Node 22"
  - type: textarea
    id: checks
    attributes:
      label: Local checks
      description: Output of the repo checks if you ran them.
      placeholder: |
        bash scripts/check-secrets.sh
        npm run typecheck
        npm test
